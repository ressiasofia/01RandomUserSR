<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

    <script src="./jsAxios/axios@1.13.min.js" defer></script>
    <script src="./jsAxios/libreria.js" defer></script>

    <script src="./index.js" defer></script>
    <link rel="stylesheet" href="./index.css">

    <title>Generate in one click</title>
    <link rel="icon" href="./img/click.png">
</head>

<body>
    <div class="container mt-3">
        <nav class="navbar navbar-expand-lg bg-lavander fixed-top">
            <div class="container-fluid">
                <a href="./firstPage.html" class="navbar-brand"><img src="./img/click.png" alt=""></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navBar"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navBar">
                    <ul class="navbar-nav text-darkPurple">
                        <li class="tag-item"><a href="" class="nav-link">Home</a></li>
                        <li class="tag-item m-2" id="allUsers">All users photos</li>
                        <li class="tag-item text-darkPurple" id="search">
                            <div class="form">
                                <input type="text" class="form-control" placeholder="🔍︎ search by name" id="txtSearch">
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </div>

    <div id="wrapper" class="container">
        <h1 id="title">Generate here your random user</h1>

        <div id="main" class="d-flex container">

            <div id="cardbody">
                <!-- <div class="card">
                    <div class="cardInner">
                        <div class="cardFront">

                        </div>
                        <div class="cardBack">

                        </div>
                    </div>
                </div> -->
            </div>

            <div id="customeBody">
                <button class="btn bg-purple text-cream buttons" id="btnGenerate">
                    Generate
                </button>
                <button class="btn bg-purple text-cream buttons" data-bs-target="#modalCustome" data-bs-toggle="modal">
                    Customize
                </button>
                <!-- Modal -->
                <div class="modal fade" id="modalCustome">
                    <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content bg-lavander text-darkPurple">
                            <div class="modal-header">
                                <h1>Customize your users:</h1>
                                <button class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <div class="col" id="custome">
                                    <br>
                                    <div class="row-auto">
                                        <label for="form-label">Users to view: 1</label>
                                        <input type="range" min="1" max="100" value="1" class="form-range" id="slider">
                                    </div>
                                    <br>
                                    <div class="row-auto">
                                        <select name="cmdGender" id="cmdGender">
                                            <option value="">All</option>
                                            <option value="male">Male</option>
                                            <option value="female">Female</option>
                                        </select>
                                    </div>
                                    <br>
                                    <div class="row-auto">
                                        <p>Select the nationality:</p>
                                        <div class="container">
                                            <div class="row text-center" id="flagBox">

                                                <div class="col-12 col-md-6 col-lg-4 mb-3" nat="US">
                                                    <img src="./img/us.png" class="img-fluid" alt="">
                                                </div>

                                                <div class="col-12 col-md-6 col-lg-4 mb-3" nat="BR">
                                                   <img src="./img/br.png" class="img-fluid" alt="">
                                                </div>

                                                <div class="col-12 col-md-6 col-lg-4 mb-3" nat="ES">
                                                    <img src="./img/es.png" class="img-fluid" alt="">
                                                </div>

                                                <div class="col-12 col-md-6 col-lg-4 mb-3" nat="GB">
                                                    <img src="./img/gb.png" class="img-fluid" alt="">
                                                </div>

                                                <div class="col-12 col-md-6 col-lg-4 mb-3" nat="CA">
                                                    <img src="./img/ca.png" class="img-fluid" alt="">
                                                </div>

                                                <div class="col-12 col-md-6 col-lg-4 mb-3" nat="FR">
                                                    <img src="./img/fr.png" class="img-fluid" alt="">
                                                </div>

                                                <div class="col-12 col-md-6 col-lg-4 mb-3" nat="NZ">
                                                    <img src="./img/nz.png" class="img-fluid" alt="">
                                                </div>

                                                <div class="col-12 col-md-6 col-lg-4 mb-3" nat="IN">
                                                    <img src="./img/in.png" class="img-fluid" alt="">
                                                </div>

                                                <div class="col-12 col-md-6 col-lg-4 mb-3" nat="DE">
                                                    <img src="./img/de.png" class="img-fluid" alt="">
                                                </div>

                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button class="btn btn-danger" data-bs-dismiss="modal">Close</button>
                                <button class="btn btn-success" id="btnSave" data-bs-dismiss="modal">Generate</button>
                            </div>
                        </div>
                    </div>
                </div>

                <button class="btn bg-purple text-cream buttons" id="btnStars">
                    Stars
                </button>
            </div>

        </div>
    </div>

    <div class="container-fluid bg-lavander p-2 fixed-bottom" id="footer">
        <div class="row">

            <div class="col">
                <a href="#" class="text-darkPurple"><img src="./img/click.png" alt="miao"></a>
            </div>

            <div class="col">
                <a href="https://github.com/ressiasofia/01RandomUserSR" class="text-darkPurple">GitHub</a>
            </div>

            <div class="col text-darkPurple">
                Created by <a href="https://www.instagram.com/sofiiressia" class="text-darkPurple"> Sofia Ressia</a>.
            </div>

        </div>
    </div>

    <!-- Modal details -->
    <div class="modal fade" id="modalDetails">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-lavander text-darkPurple">
                <div class="modal-header">
                    <h1>More details</h1>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="">
                        <div id="coneinerDet"> <!-- contenitore dei dettagli -->
                            <div class="row mb-2 text-center rowDetailsImage">
                                <img src="" alt="" class="imgDetails">
                            </div>
                            <br>
                            <div class="row mb-2">
                                <div class="col-4 fw-bold text-end">Name:</div>
                                <div class="col-4 divDetail"></div>
                            </div>

                            <div class="row mb-2">
                                <div class="col-4 fw-bold text-end">Gender:</div>
                                <div class="col-4 divDetail"></div>
                            </div>

                            <div class="row mb-2">
                                <div class="col-4 fw-bold text-end">Age:</div>
                                <div class="col-4 divDetail"></div>
                            </div>

                            <div class="row mb-2">
                                <div class="col-4 fw-bold text-end">City:</div>
                                <div class="col-4 divDetail"></div>
                            </div>

                            <div class="row mb-2">
                                <div class="col-4 fw-bold text-end">Country:</div>
                                <div class="col-4 divDetail"></div>
                            </div>

                            <div class="row mb-2">
                                <div class="col-4 fw-bold text-end">Username:</div>
                                <div class="col-4 divDetail"></div>
                            </div>

                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-danger" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
